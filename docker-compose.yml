services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cooling-agent-backend

    ports:
      - "8000:8000"

    volumes:
      - ./models:/app/models
      - ./data:/app/data

    command:
      [
        "uvicorn",
        "backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    restart: unless-stopped


  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cooling-agent-dashboard

    ports:
      - "8501:8501"

    depends_on:
      - backend

    environment:
      API_URL: "http://backend:8000/analyze"

    volumes:
      - ./data:/app/data

    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]

    restart: unless-stopped