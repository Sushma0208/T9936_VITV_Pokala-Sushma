name: Data Center Cooling Agent CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Generate telemetry dataset
        run: |
          python simulator/telemetry_generator.py

      - name: Preprocess telemetry
        run: |
          python ml/preprocess_dataset.py

      - name: Train temperature prediction model
        run: |
          python ml/temperature_prediction.py

      - name: Train anomaly detection model
        run: |
          python ml/anomaly_detection.py

      - name: Run root cause analysis
        run: |
          python ml/root_cause_analysis.py

      - name: Run cooling optimization
        run: |
          python optimization/cooling_optimizer.py

      - name: Run automated tests
        run: |
          pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build